[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-message-hub"
version = "0.2.6"
description = "Deskfellows: a local-first desktop workspace for agent collaboration"
requires-python = ">=3.11"
dependencies = []

[tool.setuptools.package-data]
hub = ["static/*", "adapter_examples/*", "builtin_adapters/*/adapter.json", "builtin_adapters/*/*.py"]

[tool.setuptools.packages.find]
include = ["hub*"]
